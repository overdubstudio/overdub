# The live site, https://overdubstudio.com, deployed by hand and approved: Actions > deploy-live > Run workflow (on
# main), with the commit to ship (default: main's head). The job runs in the production environment, so it waits for
# one of its required reviewers (AJ, brvtl) to approve, and the environment lets it start from main only. Merges to main
# go to the preview by themselves (ci.yml, deploy-staging); the live site moves only through here.
#
# The job reaches AWS through GitHub's OIDC token: no keys are stored anywhere. The role it assumes (infra/live/github.tf)
# trusts only a job in this repo's production environment, and may write the overdubstudio.com bucket, read the stems
# model's bucket and invalidate the live distribution. Its ARN and the distribution id are repository variables
# (LIVE_DEPLOY_ROLE, LIVE_DISTRIBUTION: terraform -chdir=infra/live output). The community shelf comes from the private
# overdub-devices repo, read with a read-only deploy key, the production environment's secret
# OVERDUB_DEVICES_DEPLOY_KEY: a live deploy ships the pinned shelf or nothing.
#
# The ref must be a commit on main: anything else is refused before AWS is touched. The deploy ships exactly that commit
# (deploy/deploy.sh's git archive, its deploy/live-config.json and its community pin), then tools/prod-check.js checks
# the site it went to: https://overdubstudio.com once the distribution has that name (infra/live's serve_names, the
# cutover), its cloudfront.net name before.
#
# Before any of that, the e2e job runs the whole end-to-end suite (node tools/run-all.js: the browsers, the renders,
# the real-time checks GitHub's shared macOS runners are too slow for) on Peter's self-hosted Mac mini, ghastly
# (labels self-hosted, macOS, ARM64, overdub-e2e). The deploy job needs it, so a reviewer is only asked once it passed,
# and it ships the exact commit e2e resolved and tested (main can move in between). e2e holds no AWS role, no
# environment and no secret. A self-hosted runner must never take a pull_request job: this repo is public, so a pull
# request from a fork would run its own code on that machine. test/unit/workflows.test.js fails any workflow that puts
# a self-hosted job within reach of pull_request, pull_request_target or another event an outsider can cause.
# Actions are pinned to a commit; the comment names the release.
name: deploy-live

on:
  workflow_dispatch:
    inputs:
      ref:
        description: The commit to ship, on main (a SHA, a tag or main; empty means main's head)
        type: string
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: deploy-live
  cancel-in-progress: false

jobs:
  e2e:
    # main only, like the deploy: the suite runs what is about to ship
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, macOS, ARM64, overdub-e2e]
    timeout-minutes: 90
    permissions:
      contents: read
    outputs:
      sha: ${{ steps.ref.outputs.sha }}
    env:
      INPUT_REF: ${{ inputs.ref }}
      # the suites' screenshots and logs, inside this job's workspace (the runner keeps its disk between jobs)
      OUTDIR: ${{ github.workspace }}/e2e-out
    steps:
      # clean: true (the default) wipes what an earlier job left in the workspace
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: The ref is a commit on main
        id: ref
        run: |
          want=${INPUT_REF:-origin/main}
          if ! sha=$(git rev-parse --verify --quiet "${want}^{commit}"); then
            echo "::error::$want is not a commit in this repository"; exit 1
          fi
          if ! git merge-base --is-ancestor "$sha" origin/main; then
            echo "::error::$want ($sha) is not on main: only a commit on main ships to the live site"; exit 1
          fi
          git checkout --quiet --detach "$sha"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "### End-to-end suite on $sha ($(hostname -s))" >> "$GITHUB_STEP_SUMMARY"

      # Node from mise.toml: the runner's own PATH is the system's, so nothing on the machine is relied on
      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          install_args: node

      # The downloads (~660 MB) are kept on the machine, outside the workspace: checkout's clean (git clean -ffdx) would
      # remove tools/.out/kits-cache with everything else ignored. Content-addressed, so a stale file can't be used.
      - name: Build the sampled kits this commit names
        run: KITS_CACHE="$HOME/Library/Caches/overdub-kits" node tools/fetch-kits.js

      # the browsers tools/pw.js and compat-test drive; Playwright's cache (~/Library/Caches/ms-playwright) keeps them
      - name: Install the browsers the suites drive
        run: | # zizmor: ignore[adhoc-packages] (package.json has no dependencies by design; the version is pinned here)
          npm install --no-save --no-package-lock --ignore-scripts playwright-core@1.62.0
          npx --no-install playwright-core install chromium chromium-headless-shell webkit firefox

      # One suite at a time: the real-time checks (stack-monitor's latency, the lamps that step with the song) miss their
      # deadlines with three browser suites sharing the machine. Slower (about twice run-all's default), but the point
      # of this machine is that those checks mean something.
      - name: The end-to-end suite
        env:
          PAR: '1'
        run: node tools/run-all.js | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Keep the screenshots and logs of a failed run
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-out
          path: e2e-out
          retention-days: 14

  deploy:
    needs: [e2e]
    # the environment allows main only too; this says so before a reviewer is asked
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: production
      url: https://overdubstudio.com
    permissions:
      contents: read
      id-token: write
    env:
      AWS_ROLE: ${{ vars.LIVE_DEPLOY_ROLE }}
      LIVE_DISTRIBUTION: ${{ vars.LIVE_DISTRIBUTION }}
      # the commit e2e resolved and passed, not inputs.ref again: an empty ref means main's head, which may have moved
      INPUT_REF: ${{ needs.e2e.outputs.sha }}
      # the community shelf's source (deploy/deploy.sh, tools/prod-check.js), checked out below
      OVERDUB_DEVICES_DIR: ${{ github.workspace }}/overdub-devices
      HAS_DEVICES_KEY: ${{ secrets.OVERDUB_DEVICES_DEPLOY_KEY != '' }}
    steps:
      - name: Check the variables and the deploy key are set (terraform -chdir=infra/live output; deploy/README.md)
        run: |
          [ -n "$AWS_ROLE" ] || { echo "::error::set the repository variable LIVE_DEPLOY_ROLE"; exit 1; }
          [ -n "$LIVE_DISTRIBUTION" ] || { echo "::error::set the repository variable LIVE_DISTRIBUTION"; exit 1; }
          [ "$HAS_DEVICES_KEY" = true ] || { echo "::error::set the production environment's secret OVERDUB_DEVICES_DEPLOY_KEY (a read-only deploy key on overdub-devices)"; exit 1; }

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: The ref is a commit on main
        id: ref
        run: |
          want=${INPUT_REF:-origin/main}
          if ! sha=$(git rev-parse --verify --quiet "${want}^{commit}"); then
            echo "::error::$want is not a commit in this repository"; exit 1
          fi
          if ! git merge-base --is-ancestor "$sha" origin/main; then
            echo "::error::$want ($sha) is not on main: only a commit on main ships to the live site"; exit 1
          fi
          git checkout --quiet --detach "$sha"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "### Shipping $sha to the live site" >> "$GITHUB_STEP_SUMMARY"
          git log -1 --format='%h %s (%an, %ad)' "$sha" >> "$GITHUB_STEP_SUMMARY"

      # overdub-devices, at its full history so the pinned commit is there (deploy/community-pin.json)
      - name: The overdub-devices checkout, for the community shelf
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: overdubstudio/overdub-devices
          path: overdub-devices
          fetch-depth: 0
          ssh-key: ${{ secrets.OVERDUB_DEVICES_DEPLOY_KEY }}
          persist-credentials: false

      # node only: nothing the deploy doesn't run goes near the job that holds the AWS role
      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          install_args: node

      - name: Cache the kit downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: tools/.out/kits-cache
          key: kits-cache-${{ hashFiles('tools/fetch-kits.js', 'app/src/devices/builtin/*.js') }}
          restore-keys: kits-cache-

      - name: Build the sampled kits this commit names
        run: node tools/fetch-kits.js

      # tools/prod-check.js (the last step) drives a browser through tools/pw.js: playwright-core, pinned, and its
      # headless Chromium. Installed before the AWS credentials exist in this job, so no install script sees them.
      - name: Install the browser the production check drives
        run: | # zizmor: ignore[adhoc-packages] (package.json has no dependencies by design; the version is pinned here)
          npm install --no-save --no-package-lock --ignore-scripts playwright-core@1.62.0
          npx --no-install playwright-core install --with-deps --only-shell chromium

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ env.AWS_ROLE }}
          aws-region: us-east-1

      - name: Deploy to the live site
        env:
          SHA: ${{ steps.ref.outputs.sha }}
        run: deploy/deploy.sh --skip-tests "$SHA"

      - name: Where it went (overdubstudio.com, or the cloudfront.net name before the cutover)
        id: site
        run: |
          named=$(aws cloudfront get-distribution --id "$LIVE_DISTRIBUTION" --query "contains(Distribution.DistributionConfig.Aliases.Items || \`[]\`, 'overdubstudio.com')" --output text)
          if [ "$named" = True ]; then base=https://overdubstudio.com
          else base=https://$(aws cloudfront get-distribution --id "$LIVE_DISTRIBUTION" --query Distribution.DomainName --output text)
          fi
          echo "base=$base" >> "$GITHUB_OUTPUT"
          echo "Checking $base" >> "$GITHUB_STEP_SUMMARY"

      - name: The production check
        env:
          BASE: ${{ steps.site.outputs.base }}
        run: node tools/prod-check.js "$BASE"
